[[entry]]
id = 1
type = "story"
title = "Acordar arquitectura y contratos compartidos"
description = "Arquitectura y Sebastián fijan stack, persistencia, concurrencia, escenario p95 y umbral PX-08, y registran los contratos que F4, F1 y QA deben adoptar."
verify = "Las OQ-2, OQ-3 y OQ-4 tienen decisiones fechadas y los contratos de Caso, Política, Evaluación y Salida F4 pueden ser citados por las demás épicas."
covers = ["CAP-1"]
after = []
hitl = true
risk = "medium"
unknown = "Las fuentes no definen stack, persistencia, mecanismo de concurrencia ni escenarios medibles de NFR-3/NFR-4."
references = ["_bmad-output/initiative-mira-e2-f4-f1/epic-base-ejecutable-y-contratos/spec-base-ejecutable-y-contratos/SPEC.md#open-questions"]

